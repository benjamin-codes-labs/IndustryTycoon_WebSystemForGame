[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "industry-tycoon"
version = "1.0.0"
description = "Companion web app that does the bookkeeping for the Industry Tycoon board game."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.50,<2"]

[tool.setuptools.packages.find]
include = ["industry_tycoon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RET", # flake8-return
    "RUF", # ruff-specific rules
]
# The UI is in Chinese, so full-width punctuation in strings and comments is intentional.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
files = ["app.py", "industry_tycoon"]
strict = true
